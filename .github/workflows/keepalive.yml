name: Keep Supabase projects awake
on:
  schedule:
    - cron: '0 8 */3 * *'   # elke 3 dagen om 08:00 UTC
  workflow_dispatch: {}      # handmatig kunnen starten
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Verzamelingen-project
        run: |
          curl -s -o /dev/null -w "Verzamelingen: %{http_code}\n" \
          "https://dckojtvyxqsgvcfgufpf.supabase.co/rest/v1/pokemon?select=id&limit=1" \
          -H "apikey: sb_publishable_KELGR-EkKYZBF_knnwdNvg_vA966Yqr"
      - name: Ping Huishouden-project
        run: |
          curl -s -o /dev/null -w "Huishouden: %{http_code}\n" \
          "https://vlhjikyslkkekxtapzqj.supabase.co/rest/v1/categories?select=id&limit=1" \
          -H "apikey: sb_publishable_bWtpObTiK7mmEiQYHZuvgA_upVn7e2I"
