name: Keep Supabase projects awake

on:
  schedule:
    - cron: '0 8 */3 * *'   # elke 3 dagen om 08:00 UTC
  workflow_dispatch: {}      # handmatig kunnen starten

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Pokemon-project
        run: |
          curl -s -o /dev/null -w "Pokemon: %{http_code}\n" \
          "https://dckojtvyxqsgvcfgufpf.supabase.co/rest/v1/pokemon?select=id&limit=1" \
          -H "apikey: sb_publishable_KELGR-EkKYZBF_knnwdNvg_vA966Yqr"

      - name: Ping Tassen-project
        run: |
          curl -s -o /dev/null -w "Tassen: %{http_code}\n" \
          "https://tqmafcomnidfqvrszmej.supabase.co/rest/v1/tassen?select=id&limit=1" \
          -H "apikey: sb_publishable_2Cq6N88ZDettDJ3v8vWs7A_XpyznPq8"
